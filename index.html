<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="theme-color"
      content="#1A2B3C"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#FFFFFF"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="description"
      content="Paste a lab panel and see every marker checked against its reference range, flagged, and explained, with next steps. For general education, not a diagnosis."
    />

    <title>Biograph Copilot</title>

    <meta
      property="og:title"
      content="Biograph Copilot: what in this lab panel needs attention?"
    />
    <meta
      property="og:description"
      content="Paste a lab panel and see every marker checked against its reference range, flagged, and explained, with next steps. For general education, not a diagnosis."
    />
    <meta property="og:url" content="https://biograph.pjayav.workers.dev/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://biograph.pjayav.workers.dev/og-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Biograph Copilot flags out-of-range lab markers and suggests next steps."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Biograph Copilot: what in this lab panel needs attention?"
    />
    <meta
      name="twitter:description"
      content="Paste a lab panel and see every marker checked against its reference range, flagged, and explained, with next steps. For general education, not a diagnosis."
    />
    <meta
      name="twitter:image"
      content="https://biograph.pjayav.workers.dev/og-card.png"
    />

    <script>
      document.documentElement.classList.toggle(
        "dark",
        localStorage.theme === "dark" ||
          (!("theme" in localStorage) &&
            window.matchMedia("(prefers-color-scheme: dark)").matches)
      );
    </script>

    <!-- Favicon support -->
    <link rel="icon" href="/favicon.ico" />

    <!-- Preload fonts if any -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent flash of unstyled content -->
    <style>
      html {
        background: var(--background);
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: var(--background);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/client.tsx"></script>
  </body>
</html>
